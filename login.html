<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Connexion | NathalMedic</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #0082cd 0%, #14b8a6 100%); min-height: 100vh; }
</style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
    <div class="text-center mb-6">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-teal-500 flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">NathalMedic Admin</h1>
      <p class="text-slate-500 text-sm mt-1">Entrez votre mot de passe</p>
    </div>
    <form id="loginForm" class="space-y-4">
      <input id="pwd" type="password" required placeholder="Mot de passe" 
        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none text-slate-800" />
      <p id="err" class="text-rose-500 text-sm text-center hidden">Mot de passe incorrect</p>
      <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold transition">
        Connexion
      </button>
    </form>
    <p class="text-center text-xs text-slate-400 mt-6">© 2026 NathalMedic</p>
  </div>
  <script>
    // 🔐 غير كلمة السر من هنا
    const ADMIN_PASSWORD = "nathalmedic2026";
    
    document.getElementById('loginForm').onsubmit = (e) => {
      e.preventDefault();
      const pwd = document.getElementById('pwd').value;
      if (pwd === ADMIN_PASSWORD) {
        localStorage.setItem('nm_admin', 'true');
        window.location.href = 'admin.html';
      } else {
        document.getElementById('err').classList.remove('hidden');
        document.getElementById('pwd').value = '';
      }
    };
  </script>
</body>
</html>
